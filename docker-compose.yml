version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/docker/core/postgres/data:/var/lib/postgresql/data
    networks:
      - shared_apps

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dashboard
    restart: always
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - /opt/docker/core/pgadmin:/var/lib/pgadmin
    networks:
      - shared_apps
    depends_on:
      - postgres

networks:
  shared_apps:
    external: true
